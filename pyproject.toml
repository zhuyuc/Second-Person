[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-person"
version = "1.0.0"
description = "Second Person —— 本地运行的个人智能体助手（记忆宫殿 + 八步对话流水线）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0.0",
    "numpy>=1.26.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "watchdog>=4.0.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
second-person = "start:main"

[tool.setuptools]
py-modules = ["start"]
packages = ["app", "agent", "memory", "tools", "connectors", "user_profile",
            "soul", "plugins", "scheduler", "infrastructure", "gateway",
            "observability_langfuse"]
